# Dependabot configuration.
#
# Strategy:
#   - npm at /web: weekly, group minor+patch into one PR to cut noise; majors
#     get their own PR so they can be reviewed individually. The Next.js
#     dashboard lives at /web, so that's where package.json + pnpm-lock.yaml
#     are.
#   - docker at /web: catches base-image security updates for the panel
#     Dockerfile.
#   - github-actions at /: keeps the deploy workflow's actions current.

version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/web"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    labels:
      - "dependencies"

  - package-ecosystem: "docker"
    directory: "/web"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 2
    labels:
      - "dependencies"
      - "docker"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 2
    labels:
      - "dependencies"
      - "ci"
