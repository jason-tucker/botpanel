name: Deploy Botpanel

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Cancel any in-progress run when a newer push lands on the same branch.
# Builds are purely build-and-push (no deploy step — watchtower handles
# deploy by polling GHCR), so a cancelled mid-build is safe and the
# newer commit will produce the next image anyway. Cuts CI noise +
# notification volume on rapid hot-fix pushes.
concurrency:
  group: deploy-botpanel-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-schemas:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout botpanel
        uses: actions/checkout@v4

      - name: Checkout squishybot
        uses: actions/checkout@v4
        with:
          repository: jason-tucker/squishybot
          path: .bot-repos/squishybot-src

      - name: Checkout otterbot
        uses: actions/checkout@v4
        with:
          repository: jason-tucker/otterbot
          path: .bot-repos/otterbot-src

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10

      - name: Verify vendored schemas are in sync with bot repos
        env:
          SQUISHY_REPO: ${{ github.workspace }}/.bot-repos/squishybot-src
          OTTER_REPO: ${{ github.workspace }}/.bot-repos/otterbot-src
        run: |
          cd web
          pnpm verify:schemas

  build:
    needs: verify-schemas
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Compute metadata
        id: meta
        run: |
          echo "GIT_SHA=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          echo "BUILD_TIME=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
          # Tag: :latest on main pushes, pr-N on PRs (unused — PRs don't push).
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "FLOATING_TAG=pr-${{ github.event.number }}" >> "$GITHUB_OUTPUT"
          else
            echo "FLOATING_TAG=latest" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and push Caddy ingress image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: ${{ github.event_name == 'push' }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/botpanel:${{ steps.meta.outputs.FLOATING_TAG }}
            ghcr.io/${{ github.repository_owner }}/botpanel:${{ steps.meta.outputs.GIT_SHA }}
          build-args: |
            GIT_SHA=${{ steps.meta.outputs.GIT_SHA }}
            BUILD_TIME=${{ steps.meta.outputs.BUILD_TIME }}
          cache-from: type=gha,scope=caddy
          cache-to: type=gha,scope=caddy,mode=max

      - name: Build and push Next.js dashboard image
        uses: docker/build-push-action@v7
        with:
          context: ./web
          file: ./web/Dockerfile
          push: ${{ github.event_name == 'push' }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/botpanel-web:${{ steps.meta.outputs.FLOATING_TAG }}
            ghcr.io/${{ github.repository_owner }}/botpanel-web:${{ steps.meta.outputs.GIT_SHA }}
          build-args: |
            GIT_SHA=${{ steps.meta.outputs.GIT_SHA }}
            BUILD_TIME=${{ steps.meta.outputs.BUILD_TIME }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,scope=web,mode=max
