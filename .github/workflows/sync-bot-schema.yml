name: Sync bot schema → PR

# Triggered by a repository_dispatch from otterbot or squishybot whenever
# they push schema changes to main. Re-runs scripts/sync-schema.sh against
# fresh checkouts of both bot repos and opens (or updates) a single PR with
# the resulting drift, on branch `auto/sync-bot-schemas`.
#
# Manual fire via workflow_dispatch is supported for testing the wiring or
# backfilling after a missed event.
#
# Why one PR / one branch rather than per-bot:
#   scripts/sync-schema.sh always vendors BOTH bots' schemas. Splitting per
#   source would duplicate changes from one bot into the other's PR. A
#   single rolling branch keeps the diff scoped to actual drift.

on:
  repository_dispatch:
    types: [bot-schema-changed]
  workflow_dispatch:
    inputs:
      source_repo:
        description: 'Which bot triggered this (informational; sync always covers both bots).'
        type: choice
        options: [otterbot, squishybot]
        default: otterbot
        required: true

# Coalesce rapid back-to-back dispatches into one PR run. Don't cancel an
# already-running sync — let it finish writing the PR, then the next run will
# update the same branch.
concurrency:
  group: sync-bot-schemas
  cancel-in-progress: false

permissions:
  contents: read  # PR creation uses BOTPANEL_DISPATCH_PAT so the resulting
                  # commits/PR can trigger the existing Deploy Botpanel CI.

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve inputs
        id: in
        run: |
          src_repo="${{ github.event.client_payload.source_repo || inputs.source_repo }}"
          src_ref="${{ github.event.client_payload.source_ref || 'main' }}"
          schema_dir="${{ github.event.client_payload.schema_dir }}"
          # workflow_dispatch case: derive schema_dir from source_repo
          if [ -z "$schema_dir" ]; then
            case "$src_repo" in
              otterbot)   schema_dir="otter" ;;
              squishybot) schema_dir="squishy" ;;
              *)          schema_dir="unknown" ;;
            esac
          fi
          msg="${{ github.event.client_payload.head_commit_message || 'manual workflow_dispatch' }}"
          {
            echo "source_repo=$src_repo"
            echo "source_ref=$src_ref"
            echo "schema_dir=$schema_dir"
            # Sanitize message for the PR body (single line)
            echo "trigger_msg=$(printf '%s' "$msg" | tr '\n' ' ' | head -c 200)"
          } >> "$GITHUB_OUTPUT"

      - name: Checkout botpanel
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.BOTPANEL_DISPATCH_PAT }}

      - name: Checkout squishybot
        uses: actions/checkout@v4
        with:
          repository: jason-tucker/squishybot
          # Pin to the triggering sha when squishybot was the source; otherwise main.
          ref: ${{ steps.in.outputs.source_repo == 'squishybot' && steps.in.outputs.source_ref || 'main' }}
          path: .bot-repos/squishybot-src
          token: ${{ secrets.BOTPANEL_DISPATCH_PAT }}

      - name: Checkout otterbot
        uses: actions/checkout@v4
        with:
          repository: jason-tucker/otterbot
          ref: ${{ steps.in.outputs.source_repo == 'otterbot' && steps.in.outputs.source_ref || 'main' }}
          path: .bot-repos/otterbot-src
          token: ${{ secrets.BOTPANEL_DISPATCH_PAT }}

      - name: Run sync:schemas
        env:
          SQUISHY_REPO: ${{ github.workspace }}/.bot-repos/squishybot-src
          OTTER_REPO: ${{ github.workspace }}/.bot-repos/otterbot-src
        run: bash scripts/sync-schema.sh

      - name: Detect changes
        id: diff
        run: |
          if git diff --quiet -- web/src/lib/db/schema/; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No drift — vendored schemas already in sync."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Drift detected:"
            git diff --stat -- web/src/lib/db/schema/
          fi

      - name: Open / update PR
        if: steps.diff.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.BOTPANEL_DISPATCH_PAT }}
          branch: auto/sync-bot-schemas
          base: main
          delete-branch: true
          add-paths: web/src/lib/db/schema/
          title: "chore(schema): sync vendored bot schemas"
          commit-message: |
            chore(schema): sync vendored bot schemas

            Triggered by jason-tucker/${{ steps.in.outputs.source_repo }}@${{ steps.in.outputs.source_ref }}
            ("${{ steps.in.outputs.trigger_msg }}").

            Auto-generated by .github/workflows/sync-bot-schema.yml.
          body: |
            **Auto-sync of vendored Drizzle schemas from the bot repos.**

            Latest trigger: [`jason-tucker/${{ steps.in.outputs.source_repo }}@${{ steps.in.outputs.source_ref }}`](https://github.com/jason-tucker/${{ steps.in.outputs.source_repo }}/commit/${{ steps.in.outputs.source_ref }})
            > ${{ steps.in.outputs.trigger_msg }}

            ## What this PR does
            Re-runs `scripts/sync-schema.sh` against `main` of both bot repos
            (pinned to the triggering SHA for the bot that fired the dispatch).
            Refreshes `web/src/lib/db/schema/{otter,squishy}/` to match.

            ## What you should do
            1. Skim the diff. Pure schema mirror changes are safe to merge as-is.
            2. If the bot ALSO changed runtime behaviour (e.g. new column written
               that the panel should read), you may want to extend this PR with
               panel-side query changes before merging.
            3. Merge when green. `Deploy Botpanel` rebuilds the image; Watchtower
               picks it up on the panel host within ~60s.

            ## Why this PR exists
            Before this automation, a bot merging a schema change would put
            botpanel's `main` into a red `verify-schemas` state until someone
            manually re-synced — a 4-minute window proved that on 2026-05-12.
            See the wiki Troubleshooting page for the incident pattern.
          labels: |
            schema-sync
            dependencies
