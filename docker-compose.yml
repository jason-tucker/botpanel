services:
  next:
    # Next.js dashboard. CI builds + pushes ghcr.io/<owner>/botpanel-web:latest
    # on main, :dev on dev. NEXT_IMAGE picks which floating tag this clone
    # tracks. No host port mapping — Caddy proxies via the docker network.
    image: ${NEXT_IMAGE:-ghcr.io/jason-tucker/botpanel-web:latest}
    build:
      context: ./web
      args:
        GIT_SHA: ${GIT_SHA:-dev}
        BUILD_TIME: ${BUILD_TIME:-unknown}
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: 0.0.0.0
    expose:
      - "3000"
    networks:
      botpanel-net:
        # Per-clone alias so prod+dev clones can both put a "next" service on
        # the shared botpanel-net without docker DNS round-robining between
        # them. Defaults to "next-prod" for the main stack; dev .env overrides
        # to "next-dev" so its Caddy can target the right container.
        aliases:
          - ${NEXT_ALIAS:-next-prod}
    labels:
      com.centurylinklabs.watchtower.enable: "true"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  caddy:
    # CI builds and pushes ghcr.io/<owner>/botpanel:latest on main, :dev on dev.
    # Set BOT_IMAGE in .env to choose which floating tag this clone tracks.
    image: ${BOT_IMAGE:-ghcr.io/jason-tucker/botpanel:latest}
    build:
      context: .
      args:
        GIT_SHA: ${GIT_SHA:-dev}
        BUILD_TIME: ${BUILD_TIME:-unknown}
    restart: unless-stopped
    environment:
      PORT: ${PORT:-6080}
      # Tells the Caddyfile which `next` to reverse-proxy. Defaults to
      # next-prod for the main stack; dev .env overrides to next-dev.
      # Without this, both clones' next services share the bare alias
      # `next` on botpanel-net and docker DNS round-robins between them.
      NEXT_HOST: ${NEXT_HOST:-next-prod}
    # Bind to LOOPBACK ONLY on the host so cloudflared running on the host
    # (or anywhere else on the VPS) can reach us at localhost:${PORT}. This
    # is NOT a public exposure — 127.0.0.1 is not reachable from the internet.
    # Cloudflare Tunnel is still the only path from the outside world.
    # If you're running cloudflared in this compose stack instead, it can
    # also reach us as `caddy:${PORT}` over the botpanel-net docker network.
    ports:
      - "127.0.0.1:${PORT:-6080}:${PORT:-6080}"
    expose:
      - "${PORT:-6080}"
    networks:
      - botpanel-net
    labels:
      com.centurylinklabs.watchtower.enable: "true"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # cloudflared is intentionally NOT a compose service — it runs as a standalone
  # `docker run` container outside this stack so `docker compose up -d` can never
  # recreate it (and wipe its TUNNEL_TOKEN). Bring it up once on the host:
  #
  #   mkdir -p /home/botuser/cloudflared && chmod 700 /home/botuser/cloudflared
  #   echo "TUNNEL_TOKEN=<your-token>" > /home/botuser/cloudflared/.env
  #   chmod 600 /home/botuser/cloudflared/.env
  #   docker run -d \
  #     --name cloudflared \
  #     --restart unless-stopped \
  #     --network host \
  #     --env-file /home/botuser/cloudflared/.env \
  #     --label com.centurylinklabs.watchtower.enable=true \
  #     cloudflare/cloudflared:latest \
  #     tunnel --no-autoupdate run
  #
  # --network host means Cloudflare ingress rules pointing at `localhost:6080`
  # reach Caddy (which binds 127.0.0.1:6080). It also lets ONE cloudflared
  # route both prod and dev clones at the same time without docker DNS games.

  redis:
    # Single Redis used as both the event bus (bots → panel) AND the command
    # bus (panel → bots, V2+). Internal only — no host port.
    # Bots reach it as `redis:6379` over the shared botpanel-net network.
    #
    # `profiles: [primary]` — only the prod clone brings this up. The dev
    # clone shares this same redis instance over the botpanel-net network
    # (CLAUDE.md: "dev clone is not a separate redis/db world"). Without
    # this gate, both clones spin up their own `redis` container with the
    # same network alias — DNS round-robins between them, and panel
    # publishes from the dev clone end up on dev-redis while the bot is
    # psubscribe'd to prod-redis. Every callBot() then times out.
    #
    # To start the prod clone: `COMPOSE_PROFILES=primary docker compose up -d`.
    # Dev clone runs `docker compose up -d` without that env — redis is
    # skipped and the panel/caddy resolve `redis` to the prod container.
    profiles: ["primary"]
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "60", "1", "--loglevel", "warning"]
    expose:
      - "6379"
    networks:
      - botpanel-net
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"

  watchtower:
    # Auto-pull-and-restart any container labeled `com.centurylinklabs.watchtower.enable=true`
    # when its image tag (e.g. :latest, :dev) gets a new push to GHCR. Polls every 30s.
    # Only this one watchtower is needed on the VPS — it serves prod AND dev clones.
    #
    # NOTE: containrrr/watchtower is unmaintained; nickfedor/watchtower is the
    # actively-maintained fork with current Docker API support.
    #
    # GHCR auth: if your botpanel package is PRIVATE on GHCR (default for
    # private repos), run once on the host to seed credentials:
    #   docker login ghcr.io -u <gh-user>
    # That creates ~/.docker/config.json, which we mount read-only below.
    # If the package is PUBLIC, this mount is unnecessary — comment it out.
    image: nickfedor/watchtower:latest
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      # Mounted ONLY if the file exists. Run `docker login ghcr.io` first.
      - ${HOME}/.docker/config.json:/config.json:ro
    environment:
      WATCHTOWER_POLL_INTERVAL: 30
      WATCHTOWER_LABEL_ENABLE: "true"
      WATCHTOWER_CLEANUP: "true"
      WATCHTOWER_INCLUDE_RESTARTING: "true"
      WATCHTOWER_NOTIFICATIONS_LEVEL: warn
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"

volumes:
  redis_data:

networks:
  botpanel-net:
    external: true
