services:
  next:
    # Next.js dashboard. CI builds + pushes ghcr.io/<owner>/botpanel-web:latest
    # on main, :dev on dev. NEXT_IMAGE picks which floating tag this clone
    # tracks. No host port mapping — Caddy proxies via the docker network.
    image: ${NEXT_IMAGE:-ghcr.io/jason-tucker/botpanel-web:latest}
    build:
      context: ./web
      args:
        GIT_SHA: ${GIT_SHA:-dev}
        BUILD_TIME: ${BUILD_TIME:-unknown}
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: 0.0.0.0
    expose:
      - "3000"
    networks:
      - botpanel-net
    labels:
      com.centurylinklabs.watchtower.enable: "true"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  caddy:
    # CI builds and pushes ghcr.io/<owner>/botpanel:latest on main, :dev on dev.
    # Set BOT_IMAGE in .env to choose which floating tag this clone tracks.
    image: ${BOT_IMAGE:-ghcr.io/jason-tucker/botpanel:latest}
    build:
      context: .
      args:
        GIT_SHA: ${GIT_SHA:-dev}
        BUILD_TIME: ${BUILD_TIME:-unknown}
    restart: unless-stopped
    environment:
      PORT: ${PORT:-6080}
    # Bind to LOOPBACK ONLY on the host so cloudflared running on the host
    # (or anywhere else on the VPS) can reach us at localhost:${PORT}. This
    # is NOT a public exposure — 127.0.0.1 is not reachable from the internet.
    # Cloudflare Tunnel is still the only path from the outside world.
    # If you're running cloudflared in this compose stack instead, it can
    # also reach us as `caddy:${PORT}` over the botpanel-net docker network.
    ports:
      - "127.0.0.1:${PORT:-6080}:${PORT:-6080}"
    expose:
      - "${PORT:-6080}"
    networks:
      - botpanel-net
    labels:
      com.centurylinklabs.watchtower.enable: "true"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      # Set this in .env from your Cloudflare Zero Trust → Tunnels dashboard.
      TUNNEL_TOKEN: ${CF_TUNNEL_TOKEN}
    depends_on:
      - caddy
    networks:
      - botpanel-net
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"

  watchtower:
    # Auto-pull-and-restart any container labeled `com.centurylinklabs.watchtower.enable=true`
    # when its image tag (e.g. :latest, :dev) gets a new push to GHCR. Polls every 30s.
    # Only this one watchtower is needed on the VPS — it serves prod AND dev clones.
    #
    # NOTE: containrrr/watchtower is unmaintained; nickfedor/watchtower is the
    # actively-maintained fork with current Docker API support.
    #
    # GHCR auth: if your botpanel package is PRIVATE on GHCR (default for
    # private repos), run once on the host to seed credentials:
    #   docker login ghcr.io -u <gh-user>
    # That creates ~/.docker/config.json, which we mount read-only below.
    # If the package is PUBLIC, this mount is unnecessary — comment it out.
    image: nickfedor/watchtower:latest
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      # Mounted ONLY if the file exists. Run `docker login ghcr.io` first.
      - ${HOME}/.docker/config.json:/config.json:ro
    environment:
      WATCHTOWER_POLL_INTERVAL: 30
      WATCHTOWER_LABEL_ENABLE: "true"
      WATCHTOWER_CLEANUP: "true"
      WATCHTOWER_INCLUDE_RESTARTING: "true"
      WATCHTOWER_NOTIFICATIONS_LEVEL: warn
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"

networks:
  botpanel-net:
    external: true
